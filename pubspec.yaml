name: converter_nest
description: Free offline file converter — your files never leave your device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & State
  go_router: ^14.2.0
  provider: ^6.1.2
  animations: ^2.0.11

  # Local Storage
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # File I/O (base — converters will add their packages in later modules)
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  open_file: ^3.5.7
  url_launcher: ^6.3.0
  path: ^1.9.0
  uuid: ^4.5.1

  # Image Converter
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2

  # Audio + Video (full FFmpeg build — handles both)
  ffmpeg_kit_flutter_new: ^4.6.2
  battery_plus: ^6.0.3
  flutter_foreground_task: ^8.14.0
  video_thumbnail: ^0.5.3

  # Text & Data
  markdown: ^7.2.2
  csv: ^6.0.0

  # PDF Tools
  pdf: ^3.11.1
  printing: ^5.13.1
  pdfx: ^2.7.0

  # Archive
  archive: ^3.6.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  dotted_border: ^2.1.0
  smooth_page_indicator: ^1.2.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0B0E11"
  image: assets/images/logo.png
  android_12:
    color: "#0B0E11"
    image: assets/images/logo.png
    icon_background_color: "#0B0E11"
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B0E11"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
